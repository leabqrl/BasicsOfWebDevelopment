<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multimedia Showcase Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Multimedia Showcase</h1>

        <div class="media-section">
            <h2>📷 Image</h2>
            <img src="image.jpg"
                 alt="sunset in Norway">
        </div>

        <div class="media-section">
            <h2>🎵 Audio</h2>
            <audio controls>
                <source src="audio.mp3" type="audio/mp3">
                Your browser does not support the audio element.
            </audio>
        </div>
        
        <div class="media-section">
            <h2>🎬 Video</h2>
            <video controls>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the audio element.
            </video>
        </div>
        
        <div class="sources">
            <h3>Media Sources & Licenses</h3>
            <p>Photo by <a href="https://unsplash.com/fr/@kristapsungurs?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Kristaps Ungurs</a> from <a href="https://unsplash.com/fr/photos/silhouette-diles-sur-locean-calme-au-coucher-du-soleil-x8Oro9-tG64?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a></p>     
            
            <p>Music by <a href="https://pixabay.com/users/music_for_video-22579021/?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=11157">music_for_video</a> from <a href="https://pixabay.com/music//?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=11157">Pixabay</a></p>
                        
            <p>Video by <a href="https://pixabay.com/users/blendertimer-9538909/?utm_source=link-attribution&utm_medium=referral&utm_campaign=video&utm_content=283533">Daniel Roberts</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=video&utm_content=283533">Pixabay</a></p>
        </div>
    </div>
</body>
</html>
